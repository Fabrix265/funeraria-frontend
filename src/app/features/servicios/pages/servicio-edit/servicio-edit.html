<h2>Editar servicio funerario</h2>

<div *ngIf="loading">
  Cargando servicio...
</div>

<form *ngIf="!loading" (ngSubmit)="actualizar()" class="form">

  <div class="grid">

    <div>
      <label>Dirección velación</label>
      <input [(ngModel)]="form.direccion_velacion" name="direccion_velacion">
    </div>

    <div>
      <label>Fecha</label>
      <input type="date" [(ngModel)]="form.fecha" name="fecha">
    </div>

    <div>
      <label>Tipo de pago</label>

      <select [(ngModel)]="form.tipo_pago" name="tipo_pago">

        <option value="directo">Directo</option>
        <option value="seguro">Seguro</option>
        <option value="mixto">Mixto</option>

      </select>

    </div>

    <div>
      <label>Costo</label>
      <input type="number" [(ngModel)]="form.costo" name="costo">
    </div>

  </div>

  <div class="checks">

    <label>
      <input type="checkbox"
             [(ngModel)]="form.arreglo_flora"
             name="arreglo_flora">

      Arreglo floral
    </label>

    <label>
      <input type="checkbox"
             [(ngModel)]="form.director_sepelio"
             name="director_sepelio">

      Director de sepelio
    </label>

  </div>

  <div>

    <label>Cantidad cargadores</label>

    <input type="number"
           [(ngModel)]="form.cantidad_cargadores"
           name="cantidad_cargadores">

  </div>

  <button type="submit">

    Actualizar servicio

  </button>

</form>
