<div class="page-wrapper">

  <div class="toast" [class.visible]="mensaje" [class.toast--error]="tipoMensaje === 'error'">
    <svg *ngIf="tipoMensaje === 'exito'" lucideIcon="circle-check" class="toast__icon"></svg>
    <svg *ngIf="tipoMensaje !== 'exito'" lucideIcon="circle-x" class="toast__icon"></svg>
    {{ mensaje }}
  </div>

  <header class="page-header">
    <div class="page-header__left">
      <a class="btn-dashboard" routerLink="/dashboard" title="Ir al dashboard"><svg lucideIcon="layout-dashboard"></svg></a>
      <svg lucideIcon="settings" class="page-header__icon"></svg>
      <div>
        <h1 class="page-header__title">Mi perfil</h1>
        <p class="page-header__sub">Gestión de cuenta</p>
      </div>
    </div>
  </header>

  <div class="perfil-grid">

    <div class="card">
      <h2 class="card__title"><svg lucideIcon="user"></svg> Datos actuales</h2>
      <div class="card__body">
        <div class="info-row">
          <span class="info-label">Usuario</span>
          <span class="info-value">{{ usernameActual }}</span>
        </div>
        <div class="info-row">
          <span class="info-label">Cargo</span>
          <span class="cargo-badge" [class.cargo-badge--admin]="cargoActual === 'administrador'">
            {{ cargoActual | titlecase }}
          </span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2 class="card__title"><svg lucideIcon="pencil"></svg> Actualizar perfil</h2>
      <div class="card__body">

        <div class="field">
          <label class="field__label">Nuevo usuario</label>
          <input
            class="field__input"
            type="text"
            [(ngModel)]="username"
            placeholder="Dejar vacío para no cambiar"
            minlength="3"
            maxlength="30"
            #usernameP="ngModel"
          />
          <span class="field__error" *ngIf="usernameP.invalid && usernameP.touched">
            Mínimo 3 caracteres
          </span>
        </div>

        <div class="field">
          <label class="field__label">Nueva contraseña</label>
          <div class="field__password-wrap">
            <input
              class="field__input"
              [type]="mostrarPassword ? 'text' : 'password'"
              [(ngModel)]="password"
              placeholder="Dejar vacío para no cambiar"
              minlength="6"
              maxlength="50"
              #passP="ngModel"
            />
            <button class="field__eye" type="button" (click)="togglePassword()">
              <svg *ngIf="mostrarPassword" lucideIcon="eye-off"></svg>
              <svg *ngIf="!mostrarPassword" lucideIcon="eye"></svg>
            </button>
          </div>
          <span class="field__error" *ngIf="passP.invalid && passP.touched">
            Mínimo 6 caracteres
          </span>
        </div>

        <div class="field" *ngIf="password">
          <label class="field__label">Confirmar contraseña</label>
          <div class="field__password-wrap">
            <input
              class="field__input"
              [type]="mostrarConfirmar ? 'text' : 'password'"
              [(ngModel)]="confirmar"
              placeholder="Repite la contraseña"
              minlength="6"
              maxlength="50"
              #confirmarP="ngModel"
            />
            <button class="field__eye" type="button" (click)="toggleConfirmar()">
              <svg *ngIf="mostrarConfirmar" lucideIcon="eye-off"></svg>
              <svg *ngIf="!mostrarConfirmar" lucideIcon="eye"></svg>
            </button>
          </div>
          <span class="field__error" *ngIf="confirmarP.invalid && confirmarP.touched">
            Mínimo 6 caracteres
          </span>
        </div>

        <div class="card__footer">
          <button
            class="btn btn--primary"
            (click)="guardar()"
            [disabled]="guardando"
          >
            <span class="btn-spinner" *ngIf="guardando"></span>
            {{ guardando ? 'Guardando...' : 'Guardar cambios' }}
          </button>
        </div>

      </div>
    </div>

  </div>

</div>
