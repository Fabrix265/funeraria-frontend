<div class="dash-wrapper">

  <header class="dash-header">
    <div>
      <h1 class="dash-title">Panel de control</h1>
      <p class="dash-sub">Funciones generales predefinidas</p>
    </div>
  </header>

  <!-- Servicios -->
  <section class="dash-section" *ngIf="puedeVerServicios || puedeVerIA">
    <h2 class="dash-section__label">Servicios</h2>
    <div class="dash-grid">
      <a routerLink="/servicios" class="stat-card stat-card--primary" *ngIf="puedeVerServicios">
        <span class="stat-card__icon">📋</span>
        <span class="stat-card__name">Servicios</span>
        <span class="stat-card__arrow">→</span>
      </a>
      <a routerLink="/ia" class="stat-card stat-card--ia" *ngIf="puedeVerIA">
        <span class="stat-card__icon">📷</span>
        <span class="stat-card__name">Extracción</span>
        <span class="stat-card__arrow">→</span>
      </a>
    </div>
  </section>

  <!-- Inventario -->
  <section class="dash-section" *ngIf="puedeVerAtaudes || puedeVerCapillas || puedeVerVehiculos">
    <h2 class="dash-section__label">Inventario</h2>
    <div class="dash-grid">
      <a routerLink="/ataudes" class="stat-card" *ngIf="puedeVerAtaudes">
        <span class="stat-card__icon">⚰</span>
        <span class="stat-card__name">Ataúdes</span>
        <span class="stat-card__arrow">→</span>
      </a>
      <a routerLink="/capillas" class="stat-card" *ngIf="puedeVerCapillas">
        <span class="stat-card__icon">⛪</span>
        <span class="stat-card__name">Capillas</span>
        <span class="stat-card__arrow">→</span>
      </a>
      <a routerLink="/vehiculos" class="stat-card" *ngIf="puedeVerVehiculos">
        <span class="stat-card__icon">🚗</span>
        <span class="stat-card__name">Vehículos</span>
        <span class="stat-card__arrow">→</span>
      </a>
      <a routerLink="/predicciones" class="stat-card stat-card--prono" *ngIf="puedeVerPronostico">
        <span class="stat-card__icon">📊</span>
        <span class="stat-card__name">Pronóstico</span>
        <span class="stat-card__arrow">→</span>
      </a>
    </div>
  </section>

  <!-- Personas -->
  <section class="dash-section" *ngIf="puedeVerContratantes || puedeVerFallecidos">
    <h2 class="dash-section__label">Personas</h2>
    <div class="dash-grid">
      <a routerLink="/contratantes" class="stat-card" *ngIf="puedeVerContratantes">
        <span class="stat-card__icon">👤</span>
        <span class="stat-card__name">Contratantes</span>
        <span class="stat-card__arrow">→</span>
      </a>
      <a routerLink="/fallecidos" class="stat-card" *ngIf="puedeVerFallecidos">
        <span class="stat-card__icon">🕊</span>
        <span class="stat-card__name">Fallecidos</span>
        <span class="stat-card__arrow">→</span>
      </a>
    </div>
  </section>

</div>
