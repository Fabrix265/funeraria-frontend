<div class="layout"
     [class.sidebar-cerrado]="!sidebarAbierto"
     [class.sidebar-mobile-abierto]="esMobile && sidebarAbierto">

  <div class="sidebar-overlay" *ngIf="esMobile && sidebarAbierto" (click)="cerrarSidebarMobile()"></div>

  <aside class="sidebar">

    <div class="sidebar__brand">
      <span class="sidebar__brand-logo">MA</span>
      <span class="sidebar__brand-name">Aranzabal</span>
    </div>

    <nav class="sidebar__nav">

      <span class="sidebar__section">General</span>

      <a class="sidebar__link" routerLink="/dashboard" routerLinkActive="sidebar__link--active"
         (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">⊞</span>
        <span class="sidebar__link-label">Dashboard</span>
      </a>

      <a class="sidebar__link" routerLink="/servicios" routerLinkActive="sidebar__link--active"
         *ngIf="puedeVerServicios" (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">📋</span>
        <span class="sidebar__link-label">Servicios</span>
      </a>

      <a class="sidebar__link" routerLink="/ia" routerLinkActive="sidebar__link--active"
         *ngIf="puedeVerIA" (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">📷</span>
        <span class="sidebar__link-label">Extracción</span>
      </a>

      <ng-container *ngIf="puedeVerAtaudes || puedeVerCapillas || puedeVerVehiculos">
        <span class="sidebar__section">Inventario</span>

        <a class="sidebar__link" routerLink="/ataudes" routerLinkActive="sidebar__link--active"
           *ngIf="puedeVerAtaudes" (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">⚰</span>
          <span class="sidebar__link-label">Ataúdes</span>
        </a>

        <a class="sidebar__link" routerLink="/capillas" routerLinkActive="sidebar__link--active"
           *ngIf="puedeVerCapillas" (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">⛪</span>
          <span class="sidebar__link-label">Capillas</span>
        </a>

        <a class="sidebar__link" routerLink="/vehiculos" routerLinkActive="sidebar__link--active"
           *ngIf="puedeVerVehiculos" (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">🚗</span>
          <span class="sidebar__link-label">Vehículos</span>
        </a>

        <a class="sidebar__link" routerLink="/predicciones" routerLinkActive="sidebar__link--active"
           (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">📊</span>
          <span class="sidebar__link-label">Pronóstico</span>
        </a>
      </ng-container>

      <ng-container *ngIf="puedeVerContratantes || puedeVerFallecidos">
        <span class="sidebar__section">Personas</span>

        <a class="sidebar__link" routerLink="/contratantes" routerLinkActive="sidebar__link--active"
           *ngIf="puedeVerContratantes" (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">👤</span>
          <span class="sidebar__link-label">Contratantes</span>
        </a>

        <a class="sidebar__link" routerLink="/fallecidos" routerLinkActive="sidebar__link--active"
           *ngIf="puedeVerFallecidos" (click)="cerrarSidebarMobile()">
          <span class="sidebar__link-icon">🕊</span>
          <span class="sidebar__link-label">Fallecidos</span>
        </a>
      </ng-container>

      <span class="sidebar__section">Sistema</span>

      <a class="sidebar__link" routerLink="/usuarios" routerLinkActive="sidebar__link--active"
         *ngIf="esAdmin" (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">👥</span>
        <span class="sidebar__link-label">Usuarios</span>
      </a>

      <a class="sidebar__link" routerLink="/roles" routerLinkActive="sidebar__link--active"
         *ngIf="esAdmin" (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">🛡️</span>
        <span class="sidebar__link-label">Roles</span>
      </a>

      <a class="sidebar__link" routerLink="/perfil" routerLinkActive="sidebar__link--active"
         (click)="cerrarSidebarMobile()">
        <span class="sidebar__link-icon">⚙</span>
        <span class="sidebar__link-label">Perfil</span>
      </a>

    </nav>

    <div class="sidebar__footer">
      <button class="sidebar__logout" (click)="logout()">
        <span class="sidebar__link-icon">↩</span>
        <span class="sidebar__link-label">Cerrar sesión</span>
      </button>
    </div>

  </aside>

  <div class="contenido">
    <header class="navbar">
      <button class="navbar__toggle" (click)="toggleSidebar()" title="Menú">
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
        <span class="navbar__toggle-bar"></span>
      </button>
      <span class="navbar__spacer"></span>
    </header>

    <main class="main-content">
      <router-outlet></router-outlet>
    </main>
  </div>

</div>
